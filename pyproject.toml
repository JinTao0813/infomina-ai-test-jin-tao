[project]
name = "location-entropy-analysis"
version = "0.1.0"
description = "Reproducible location entropy analysis of Foursquare check-ins"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jupyter>=1.1,<2",
  "matplotlib>=3.9,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "seaborn>=0.13,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/location_entropy"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

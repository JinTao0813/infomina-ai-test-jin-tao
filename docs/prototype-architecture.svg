<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Context-Aware Discovery prototype architecture</title>
  <desc id="desc">The browser loads the analysis and prototype interface from Next.js, then calls FastAPI directly for Discovery Mode. FastAPI ranks synthetic profiles against a privacy-safe aggregate candidate catalog generated offline from historical check-ins.</desc>
  <rect width="1200" height="360" fill="#f3f6fb"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#111c34">
    <text x="70" y="62" font-size="28" font-weight="700">Context-Aware Discovery</text>
    <text x="70" y="91" font-size="15" fill="#516079">Static analysis · synthetic profiles · safe historical aggregates</text>
    <g transform="translate(70 132)">
      <g>
        <rect width="190" height="112" rx="8" fill="#111c34"/>
        <text x="22" y="46" font-size="21" font-weight="700" fill="#fff">Browser</text>
        <text x="22" y="74" font-size="14" fill="#dfe6ff">Reviewer controls</text>
        <text x="22" y="94" font-size="14" fill="#dfe6ff">and explanations</text>
      </g>
      <g transform="translate(252)">
        <rect width="220" height="112" rx="8" fill="#fff" stroke="#8f9db3" stroke-width="2"/>
        <text x="22" y="43" font-size="20" font-weight="700">Next.js + React</text>
        <text x="22" y="70" font-size="14" fill="#516079">Static analysis artifact</text>
        <text x="22" y="91" font-size="14" fill="#516079">No raw check-ins</text>
      </g>
      <g transform="translate(534)">
        <rect width="220" height="112" rx="8" fill="#284bdb"/>
        <text x="22" y="43" font-size="20" font-weight="700" fill="#fff">FastAPI</text>
        <text x="22" y="70" font-size="14" fill="#e8ecff">Pydantic contracts</text>
        <text x="22" y="91" font-size="14" fill="#e8ecff">Restricted local CORS</text>
      </g>
      <g transform="translate(816)">
        <rect width="244" height="112" rx="8" fill="#d9f45f" stroke="#829516" stroke-width="2"/>
        <text x="22" y="39" font-size="19" font-weight="700">Deterministic policy</text>
        <text x="22" y="66" font-size="14" fill="#354000">Synthetic profiles</text>
        <text x="22" y="88" font-size="14" fill="#354000">Safe aggregate catalog</text>
      </g>
      <g fill="none" stroke="#284bdb" stroke-width="3">
        <path d="M252 56 H202"/>
        <path d="M95 112 V136 H644 V120"/>
        <path d="M762 56 H804"/>
      </g>
      <g fill="#284bdb">
        <path d="M202 56 l10 -6 v12z"/><path d="M644 112 l-6 10 h12z"/><path d="M804 56 l-10 -6 v12z"/>
      </g>
      <text x="204" y="42" font-size="11" fill="#516079">static UI</text>
      <text x="318" y="153" font-size="11" fill="#516079">direct JSON/HTTP</text>
      <text x="770" y="42" font-size="11" fill="#516079">in memory</text>
    </g>
    <text x="70" y="294" font-size="14" font-weight="700" fill="#1735aa">OFFLINE / ONLINE BOUNDARY</text>
    <line x1="70" y1="307" x2="1130" y2="307" stroke="#8f9db3" stroke-dasharray="6 6"/>
    <text x="70" y="333" font-size="14" fill="#516079">Offline generators read executed notebook and source check-ins; website build and API load only committed safe artifacts.</text>
  </g>
</svg>
